name: Build profile card

on:
  schedule:
    - cron: "17 3 * * *"       # daily, a little off the hour to dodge the rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - stats.py
      - render.py
      - assets/**
      - .github/workflows/build.yaml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A personal access token with `repo` scope is required, not optional.
      # Actions' built-in GITHUB_TOKEN is scoped to this one repository, so it
      # reports a fraction of the account and would silently shrink the card.
      - name: Check token
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::ACCESS_TOKEN secret is not set. Create a personal"\
                 "access token with 'repo' scope, then run:"\
                 "gh secret set ACCESS_TOKEN --repo piyushhhxyz/piyushhhxyz"
            exit 1
          fi

      - name: Collect stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python stats.py

      - name: Render SVG
        run: python render.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dark_mode.svg light_mode.svg cache
          if git diff --staged --quiet; then
            echo "card unchanged"
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
