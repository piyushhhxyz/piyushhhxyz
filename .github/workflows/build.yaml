name: Build profile card

on:
  schedule:
    - cron: "17 3 * * *"       # daily, a little off the hour to dodge the rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - stats.py
      - render.py
      - assets/**
      - .github/workflows/build.yaml

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # ACCESS_TOKEN is a personal access token with `repo` scope; it makes
      # private contributions count too. Without it the built-in token is used
      # and only public activity is measured.
      - name: Collect stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python stats.py

      - name: Render SVG
        run: python render.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dark_mode.svg light_mode.svg cache
          if git diff --staged --quiet; then
            echo "card unchanged"
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
